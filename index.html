<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Galaga</title>
<style>
  :root {
    --bg: #000;
    --bg-deep: #040814;
    --hud-bg: rgba(6, 16, 29, 0.72);
    --hud-color: #fff;
    --accent: #0ff;
    --accent-soft: rgba(0, 255, 255, 0.35);
    --danger: #f44;
    --warning: #ffd84d;
    --success: #7cff8c;
    --font-primary: "Courier New", monospace;
    --focus-ring: 2px solid var(--accent);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--hud-color);
    font-family: var(--font-primary);
    flex-direction: column;
  }
  #game-root {
    position: relative;
    background: radial-gradient(circle at center, #1a0a2e 0%, var(--bg-deep) 55%, #000 100%);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #000;
  }
  canvas:focus {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }
  /* Screen reader only */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  /* Touch controls - enhanced tactile design */
  #touch-controls {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px 20px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.22;
    transition: opacity 0.3s ease;
  }
  #touch-controls.active {
    opacity: 0.9;
  }
  .touch-btn {
    pointer-events: auto;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 2px solid rgba(0, 255, 255, 0.6);
    background: linear-gradient(145deg, #1a1f35, #0d1120);
    color: #0ff;
    font-size: 24px;
    font-family: "Courier New", monospace;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
    transition: all 0.1s ease;
  }
  .touch-btn:focus-visible {
    outline: var(--focus-ring);
    outline-offset: 3px;
  }
  .touch-btn:active {
    transform: scale(0.92);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
    background: linear-gradient(145deg, #0d1120, #0a0f1a);
  }
  .touch-btn-fire {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    border-color: rgba(255, 68, 68, 0.6);
    background: linear-gradient(145deg, #350505, #1f0303);
    color: #f44;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(255,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.1);
  }
  .touch-btn-fire:active {
    background: linear-gradient(145deg, #1f0303, #150202);
    border-color: #f44;
    text-shadow: 0 0 8px #f44;
    box-shadow: 0 0 15px rgba(255,0,0,0.4);
  }
  @media (prefers-reduced-motion: reduce) {
    #touch-controls {
      transition: none;
    }
    .touch-btn {
      transition: none;
    }
  }
</style>
</head>
<body>
<div id="game-root" role="application" aria-label="Galaga Space Shooter Game">
  <canvas id="gameCanvas" tabindex="0" aria-label="Game area - Use arrow keys to move, space to fire, ESC to pause" aria-describedby="game-controls" aria-keyshortcuts="ArrowLeft ArrowRight Space Enter Escape P M H C B"></canvas>

  <!-- ARIA live region for screen reader announcements -->
  <div id="game-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Controls description for screen readers -->
  <div class="sr-only" id="game-controls">
    Controls: Left and Right arrow keys to move. Space to fire. Enter or Space to start or restart.
    Escape or P to pause. M to toggle sound. H to toggle high contrast mode. B cycles color assist palettes.
    C continues a saved mission when available.
  </div>

  <!-- Touch controls for mobile -->
  <div id="touch-controls" aria-hidden="true">
    <button type="button" class="touch-btn" data-dir="left" aria-label="Move Left">&larr;</button>
    <button type="button" class="touch-btn touch-btn-fire" data-dir="fire" aria-label="Fire">FIRE</button>
    <button type="button" class="touch-btn" data-dir="right" aria-label="Move Right">&rarr;</button>
  </div>
</div>

<script>

const TOGGLE_KEYS = new Set(["Escape", "KeyP", "KeyM", "KeyH", "KeyC", "KeyB"]);

const managedTimeouts = new Set();
const startInputSources = new Set();

const performanceMetrics = {
  frameTime: 0,
  updateDuration: 0,
  renderDuration: 0,
  collisionChecks: 0,
};
const TOUCH_PATTERNS = Object.freeze({
  shot: [10],
  powerup: [35, 20, 35],
  hit: [120],
  wave: [40, 20, 60],
});

function addManagedListener(target, type, handler, options) {
  target.addEventListener(type, handler, options);
  cleanupCallbacks.push(function() {
    target.removeEventListener(type, handler, options);
  });
  return handler;
}

function setManagedTimeout(callback, delay) {
  const timeoutId = window.setTimeout(function() {
    managedTimeouts.delete(timeoutId);
    callback();
  }, delay);
  managedTimeouts.add(timeoutId);
  return timeoutId;
}

function clearManagedTimeouts() {
  managedTimeouts.forEach(function(timeoutId) {
    window.clearTimeout(timeoutId);
  });
  managedTimeouts.clear();
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function seededRandom(seed) {
  const value = Math.sin(seed * 12.9898) * 43758.5453123;
  return value - Math.floor(value);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function vibratePattern(name) {
  if (prefersReducedMotion || !("vibrate" in navigator)) {
    return;
  }
  var pattern = TOUCH_PATTERNS[name];
  if (pattern) {
    navigator.vibrate(pattern);
  }
}

function withAlpha(hex, alpha) {
  var r;
  var g;
  var b;
  if (hex.length === 4) {
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  } else {
    r = parseInt(hex.slice(1, 3), 16);
    g = parseInt(hex.slice(3, 5), 16);
    b = parseInt(hex.slice(5, 7), 16);
  }
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

function formatTimer(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const seconds = (totalSeconds % 60).toString().padStart(2, "0");
  return minutes + ":" + seconds;
}

function pickWeightedPowerupType() {
  let total = 0;
  for (let i = 0; i < POWERUP_ORDER.length; i++) {
    total += POWERUP_TYPES[POWERUP_ORDER[i]].rarity;
  }
  let roll = Math.random() * total;
  for (let j = 0; j < POWERUP_ORDER.length; j++) {
    const type = POWERUP_ORDER[j];
    roll -= POWERUP_TYPES[type].rarity;
    if (roll <= 0) {
      return type;
    }
  }
  return POWERUP_ORDER[0];
}

function parseStoredJSON(key, fallbackValue) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallbackValue;
    return JSON.parse(raw);
  } catch (error) {
    debugLog("Storage parse failed for " + key, error);
    return fallbackValue;
  }
}

function writeStoredJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (error) {
    debugLog("Storage write failed for " + key, error);
    return false;
  }
}

function debugLog(msg, data) {
  if (DEBUG) {
    console.log("[GALAGA] " + msg, data !== undefined ? data : "");
  }
}

// ============================================================
// GLOBAL ERROR HANDLERS
// ============================================================
function getErrorMessage(errorLike, fallback) {
  if (typeof errorLike === "string") {
    return errorLike;
  }
  if (errorLike && typeof errorLike.message === "string") {
    return errorLike.message;
  }
  if (errorLike && typeof errorLike.reason === "string") {
    return errorLike.reason;
  }
  return fallback || "Unknown error";
}

function attemptRecovery(errorLike) {
  const message = getErrorMessage(errorLike, "").toLowerCase();
  try {
    if (message.indexOf("audio") !== -1 || message.indexOf("oscillator") !== -1) {
      suspendAudioContext();
      if (options.soundEnabled) {
        resumeAudioContext();
      }
      return "Audio systems reset.";
    }
    if (message.indexOf("canvas") !== -1 || message.indexOf("context") !== -1 || message.indexOf("draw") !== -1) {
      initCanvas();
      resizeCanvas();
      return "Display systems recalibrated.";
    }
  } catch (recoveryError) {
    debugLog("Recovery failed", recoveryError);
  }
  return "";
}

function handleFatalError(errorLike, source) {
  const message = getErrorMessage(errorLike, "Unknown error");
  const recoveryMessage = attemptRecovery(errorLike);
  console.error("Game error [" + source + "]:", errorLike);

  if (typeof game !== "undefined" && game) {
    game.error = message;
    if (recoveryMessage) {
      if (game.mode === "PLAYING") {
        game.mode = "PAUSED";
      }
      if (Array.isArray(game.hudAlerts)) {
        pushHudAlert("SYSTEM RECOVERED", "#ffd84d", 1300);
      }
      if (typeof game.time === "number") {
        beginTransition("SYSTEM RECOVERED", "#ffd84d", 760, "pulse");
      }
      updateARIA(game.mode === "PAUSED"
        ? recoveryMessage + " Press Escape or P to continue."
        : recoveryMessage + " Press Enter or Space when ready.");
      return true;
    }
    game.mode = "ERROR";
  }

  updateARIA("Unexpected error. Press Enter or Space to restart.");
  return false;
}

window.addEventListener("error", function(e) {
  handleFatalError(e.error || e.message || e, "window-error");
});

window.addEventListener("unhandledrejection", function(e) {
  handleFatalError(e.reason || e, "unhandledrejection");
});

// ============================================================
// DIFFICULTY SYSTEM
// ============================================================
const DIFFICULTY_LEVELS = [
  { wave: 1,  diveInterval: 4000, diveSpeed: 200, fireChance: 0.003 },
  { wave: 5,  diveInterval: 3200, diveSpeed: 230, fireChance: 0.004 },
  { wave: 10, diveInterval: 2600, diveSpeed: 260, fireChance: 0.005 },
  { wave: 15, diveInterval: 2000, diveSpeed: 300, fireChance: 0.006 },
  { wave: 20, diveInterval: 1500, diveSpeed: 340, fireChance: 0.007 },
];

function getDifficultyForWave(wave) {
  const clampedWave = Math.min(wave, DIFFICULTY_LEVELS[DIFFICULTY_LEVELS.length - 1].wave);
  let previousLevel = DIFFICULTY_LEVELS[0];
  let nextLevel = DIFFICULTY_LEVELS[DIFFICULTY_LEVELS.length - 1];

  for (let i = 0; i < DIFFICULTY_LEVELS.length - 1; i++) {
    if (clampedWave >= DIFFICULTY_LEVELS[i].wave && clampedWave <= DIFFICULTY_LEVELS[i + 1].wave) {
      previousLevel = DIFFICULTY_LEVELS[i];
      nextLevel = DIFFICULTY_LEVELS[i + 1];
      break;
    }
  }

  const range = nextLevel.wave - previousLevel.wave;
  const interpolation = range > 0 ? (clampedWave - previousLevel.wave) / range : 0;
  const diveIntervalVariance = 0.9 + seededRandom(wave * 17 + 1) * 0.2;
  const fireChanceVariance = 0.95 + seededRandom(wave * 29 + 2) * 0.1;

  return {
    diveInterval: Math.max(
      (previousLevel.diveInterval + (nextLevel.diveInterval - previousLevel.diveInterval) * interpolation) * diveIntervalVariance,
      CFG.DIVE_INTERVAL_MIN
    ),
    diveSpeed: previousLevel.diveSpeed + (nextLevel.diveSpeed - previousLevel.diveSpeed) * interpolation,
    fireChance: (previousLevel.fireChance + (nextLevel.fireChance - previousLevel.fireChance) * interpolation) * fireChanceVariance,
  };
}

const options = {

};

function loadPreferences() {
  const prefs = parseStoredJSON(STORAGE_KEYS.preferences, null);
  if (!prefs || typeof prefs !== "object") {
    return;
  }
  if (typeof prefs.highContrast === "boolean") options.highContrast = prefs.highContrast;
  if (typeof prefs.soundEnabled === "boolean") options.soundEnabled = prefs.soundEnabled;
  if (typeof prefs.colorblindMode === "string") options.colorblindMode = prefs.colorblindMode;
}

function savePreferences() {
  writeStoredJSON(STORAGE_KEYS.preferences, {
    highContrast: options.highContrast,
    soundEnabled: options.soundEnabled,
    colorblindMode: options.colorblindMode,
  });
}

function getTheme() {
  const baseTheme = options.highContrast ? THEMES.highContrast : THEMES.normal;
  const theme = {
    bg: baseTheme.bg,
    hud: baseTheme.hud,
    accent: baseTheme.accent,
    danger: baseTheme.danger,
    player: baseTheme.player,
    playerShot: baseTheme.playerShot,
    enemyShot: baseTheme.enemyShot,
    enemies: {
      0: baseTheme.enemies[0],
      1: baseTheme.enemies[1],
      2: baseTheme.enemies[2],
    },
    starColor: baseTheme.starColor,
    pauseText: baseTheme.pauseText,
    startTitle: baseTheme.startTitle,
    startSubtitle: baseTheme.startSubtitle,
  };

  if (options.colorblindMode === "deuteranopia") {
    theme.accent = "#74f0ff";

    theme.playerShot = "#ffffff";
    theme.enemyShot = "#ff934d";
    theme.enemies[0] = "#ff934d";

    theme.enemyShot = "#ffd84d";
    theme.enemies[0] = "#ffd84d";

    theme.enemies[2] = "#cf7bff";

    theme.accent = "#ff92a5";
    theme.player = "#7dff9d";
    theme.playerShot = "#7dff9d";
    theme.enemyShot = "#ff92a5";
    theme.enemies[0] = "#ff92a5";
    theme.enemies[1] = "#7dff9d";
    theme.enemies[2] = "#ffffff";
  }

  return theme;
}

// ============================================================
// CANVAS SETUP (with error handling)
// ============================================================
let canvas = null;
let ctx = null;

function initCanvas() {
  canvas = document.getElementById("gameCanvas");
  if (!canvas) {
    throw new Error("Canvas element not found");
  }
  ctx = canvas.getContext("2d");
  if (!ctx) {
    throw new Error("Canvas 2D context not supported");
  }
  ctx.imageSmoothingEnabled = false;
  canvas.focus();
  debugLog("Canvas initialized");
}

function resizeCanvas() {
  if (!canvas || !ctx) return;
  try {
    const dpr = window.devicePixelRatio || 1;
    const aspect = CFG.W / CFG.H;
    let displayW = window.innerWidth;
    let displayH = window.innerHeight;
    if (displayW / displayH > aspect) {
      displayW = displayH * aspect;
    } else {
      displayH = displayW / aspect;
    }
    canvas.style.width = displayW + "px";
    canvas.style.height = displayH + "px";
    canvas.width = CFG.W * dpr;
    canvas.height = CFG.H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    debugLog("Canvas resized", { displayW: displayW, displayH: displayH, dpr: dpr });
  } catch (e) {
    console.error("Canvas resize failed:", e);
    canvas.width = CFG.W;
    canvas.height = CFG.H;
  }
}

// ============================================================
// INPUT SYSTEM
// ============================================================
const keys = { left: false, right: false, fire: false, start: false, continueGame: false };

function syncStartKeyState() {
  keys.start = startInputSources.size > 0;
}

function setStartKeyState(source, isPressed) {
  if (!source) {
    return;
  }
  if (isPressed) {
    startInputSources.add(source);
  } else {
    startInputSources.delete(source);
  }
  syncStartKeyState();
}

function clearStartKeyState() {
  startInputSources.clear();
  syncStartKeyState();
}

function clearTransientInputState() {
  keys.left = false;
  keys.right = false;
  keys.fire = false;
  keys.continueGame = false;
  clearStartKeyState();
}

function handleKeyDown(e) {
  if (e.repeat && TOGGLE_KEYS.has(e.code)) {
    e.preventDefault();
    return;
  }
  switch (e.code) {
    case "ArrowLeft":
      keys.left = true;
      e.preventDefault();
      break;
    case "ArrowRight":
      keys.right = true;
      e.preventDefault();
      break;
    case "Space":
      keys.fire = true;
      setStartKeyState(e.code, true);
      e.preventDefault();
      break;
    case "Enter":
      setStartKeyState(e.code, true);
      e.preventDefault();
      break;
    case "KeyC":
      keys.continueGame = true;
      e.preventDefault();
      break;
    case "Escape":
    case "KeyP":
      togglePause();
      e.preventDefault();
      break;
    case "KeyM":
      toggleSound();
      e.preventDefault();
      break;
    case "KeyH":
      toggleHighContrast();
      e.preventDefault();
      break;
    case "KeyB":
      toggleColorblindMode();
      e.preventDefault();
      break;
  }
}

function handleKeyUp(e) {
  switch (e.code) {
    case "ArrowLeft":
      keys.left = false;
      break;
    case "ArrowRight":
      keys.right = false;
      break;
    case "Space":
      keys.fire = false;
      if (START_KEYS.has(e.code)) setStartKeyState(e.code, false);
      break;
    case "Enter":
      if (START_KEYS.has(e.code)) setStartKeyState(e.code, false);
      break;
    case "KeyC":
      keys.continueGame = false;
      break;
  }
}

// ============================================================
// TOUCH CONTROLS
// ============================================================
function initTouchControls() {
  const container = document.getElementById("touch-controls");
  if (!container) return;

  const activeTouchDirections = new Map();
  const touchButtons = Array.from(container.querySelectorAll(TOUCH_BUTTON_SELECTOR));
  const isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  let touchFadeTimeout = 0;

  function markTouchControlsActive() {
    container.classList.add("active");
    if (touchFadeTimeout) {
      window.clearTimeout(touchFadeTimeout);
    }
    touchFadeTimeout = window.setTimeout(function() {
      container.classList.remove("active");
      touchFadeTimeout = 0;
    }, 2200);
  }

  function applyActiveTouchDirections() {
    keys.left = false;
    keys.right = false;
    keys.fire = false;
    activeTouchDirections.forEach(function(dir) {
      if (dir === "left") keys.left = true;
      if (dir === "right") keys.right = true;
      if (dir === "fire") keys.fire = true;
    });
  }

  function resolveTouchButton(touch) {
    const elements = document.elementsFromPoint(touch.clientX, touch.clientY);
    return elements.find(function(element) {
      return element.matches && element.matches(TOUCH_BUTTON_SELECTOR);
    }) || null;
  }

  function updateTouchVisibility() {
    const visible = isTouchDevice && window.innerWidth < 1024;
    container.setAttribute("aria-hidden", visible ? "false" : "true");
    if (visible) {
      container.style.display = "flex";
    } else {
      container.style.display = "none";
    }
  }

  addManagedListener(window, "resize", updateTouchVisibility);
  updateTouchVisibility();

  addManagedListener(container, "touchstart", function(e) {
    e.preventDefault();
    markTouchControlsActive();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const button = resolveTouchButton(touch);
      if (button && button.dataset && button.dataset.dir) {
        const dir = button.dataset.dir;
        activeTouchDirections.set(touch.identifier, dir);
        if (dir === "fire") {
          setStartKeyState("touch-fire:" + touch.identifier, true);
        }
      }
    }
    applyActiveTouchDirections();
    resumeAudioContext();
  }, { passive: false });

  addManagedListener(container, "touchmove", function(e) {
    e.preventDefault();
    markTouchControlsActive();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const previousDir = activeTouchDirections.get(touch.identifier);
      const button = resolveTouchButton(touch);
      if (button && button.dataset && button.dataset.dir) {
        const nextDir = button.dataset.dir;
        activeTouchDirections.set(touch.identifier, nextDir);
        if (previousDir === "fire" && nextDir !== "fire") {
          setStartKeyState("touch-fire:" + touch.identifier, false);
        } else if (nextDir === "fire") {
          setStartKeyState("touch-fire:" + touch.identifier, true);
        }
      } else {
        activeTouchDirections.delete(touch.identifier);
        if (previousDir === "fire") {
          setStartKeyState("touch-fire:" + touch.identifier, false);
        }
      }
    }
    applyActiveTouchDirections();
  }, { passive: false });

  function releaseTouches(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touchId = e.changedTouches[i].identifier;
      if (activeTouchDirections.get(touchId) === "fire") {
        setStartKeyState("touch-fire:" + touchId, false);
      }
      activeTouchDirections.delete(touchId);
    }
    applyActiveTouchDirections();
  }

  addManagedListener(container, "touchend", releaseTouches, { passive: false });
  addManagedListener(container, "touchcancel", releaseTouches, { passive: false });

  function setDirectionState(dir, isPressed, source) {
    if (isPressed) {
      markTouchControlsActive();
    }
    if (dir === "left") keys.left = isPressed;
    if (dir === "right") keys.right = isPressed;
    if (dir === "fire") {
      keys.fire = isPressed;
      setStartKeyState(source || "button-fire", isPressed);
      if (isPressed) {
        vibratePattern("shot");
      }
    }
    if (isPressed) resumeAudioContext();
  }

  touchButtons.forEach(function(button) {
    const dir = button.dataset.dir;
    const source = "button:" + dir;
    addManagedListener(button, "pointerdown", function(e) {
      e.preventDefault();
      setDirectionState(dir, true, source);
    });
    addManagedListener(button, "pointerup", function() {
      setDirectionState(dir, false, source);
    });
    addManagedListener(button, "pointercancel", function() {
      setDirectionState(dir, false, source);
    });
    addManagedListener(button, "pointerleave", function() {
      setDirectionState(dir, false, source);
    });
    addManagedListener(button, "keydown", function(e) {
      if (e.code === "Enter" || e.code === "Space") {
        e.preventDefault();
        setDirectionState(dir, true, source);
      }
    });
    addManagedListener(button, "keyup", function(e) {
      if (e.code === "Enter" || e.code === "Space") {
        e.preventDefault();
        setDirectionState(dir, false, source);
      }
    });
    addManagedListener(button, "blur", function() {
      setDirectionState(dir, false, source);
    });
  });

  if (canvas) {
    addManagedListener(canvas, "touchstart", function(e) {
      e.preventDefault();
      markTouchControlsActive();
      setStartKeyState("canvas-touch", true);
      resumeAudioContext();
    }, { passive: false });
    addManagedListener(canvas, "touchend", function() {
      setStartKeyState("canvas-touch", false);
    }, { passive: false });
    addManagedListener(canvas, "touchcancel", function() {
      setStartKeyState("canvas-touch", false);
    }, { passive: false });
  }
}

// ============================================================
// AUDIO SYSTEM (with error handling, mute, and context resume)
// ============================================================
var AudioSys = (function() {
  let actx = null;
  let audioAvailable = true;

  function getCtx() {
    if (!actx && audioAvailable) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") {
          actx.resume();
        }
        debugLog("Audio context created");
      } catch (e) {
        console.warn("Audio system not available:", e);
        audioAvailable = false;
      }
    }
    return actx;
  }

  function play(freq, duration, type, vol) {
    if (!options.soundEnabled) return;
    const c = getCtx();
    if (!c) return;
    try {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "square";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.1, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration);
    } catch (e) {
      debugLog("Audio play failed", e);
    }
  }

  function sequence(notes, gapMs) {
    const delay = gapMs || 70;
    for (let i = 0; i < notes.length; i++) {
      (function(note, index) {
        setManagedTimeout(function() {
          play(note.freq, note.duration, note.type, note.vol);
        }, index * delay);
      })(notes[i], i);
    }
  }

  return {
    getCtx: getCtx,
    peekCtx: function() { return actx; },
    isAvailable: function() { return audioAvailable; },
    shoot:     function(variant) {
      play(variant === "spread" ? 720 : variant === "rapid" ? 980 : 880, 0.08, "square", 0.08);
    },
    explode:   function() { play(120, 0.25, "sawtooth", 0.12); },
    playerHit: function() { play(200, 0.35, "sawtooth", 0.15); },
    gameOver:  function() { play(150, 0.6, "triangle", 0.12); },
    waveStart: function() { play(440, 0.15, "triangle", 0.08); },
    waveClear: function() {
      sequence([
        { freq: 660, duration: 0.09, type: "triangle", vol: 0.08 },
        { freq: 880, duration: 0.11, type: "triangle", vol: 0.08 },
        { freq: 1100, duration: 0.14, type: "triangle", vol: 0.08 },
      ], 80);
    },
    pause:     function() { play(330, 0.1, "sine", 0.06); },
    combo: function(comboCount) {
      play(comboCount >= 10 ? 1240 : comboCount >= 5 ? 1040 : 900, 0.11, "triangle", 0.09);
    },
    powerup: function(type) {
      const tier = POWERUP_TYPES[type] ? POWERUP_TYPES[type].tier : "common";
      if (tier === "legendary") {
        sequence([
          { freq: 660, duration: 0.08, type: "triangle", vol: 0.09 },
          { freq: 880, duration: 0.1, type: "triangle", vol: 0.09 },
          { freq: 1320, duration: 0.12, type: "triangle", vol: 0.09 },
        ], 65);
      } else if (tier === "rare") {
        sequence([
          { freq: 420, duration: 0.14, type: "sine", vol: 0.08 },
          { freq: 720, duration: 0.12, type: "triangle", vol: 0.08 },
        ], 95);
      } else if (tier === "uncommon") {
        sequence([
          { freq: 520, duration: 0.09, type: "triangle", vol: 0.08 },
          { freq: 760, duration: 0.11, type: "triangle", vol: 0.08 },
        ], 70);
      } else {
        play(980, 0.12, "triangle", 0.09);
      }
    },
    luckyShot: function() {
      sequence([
        { freq: 360, duration: 0.12, type: "sawtooth", vol: 0.12 },
        { freq: 720, duration: 0.15, type: "square", vol: 0.1 },
        { freq: 1280, duration: 0.1, type: "triangle", vol: 0.08 },
      ], 75);
    },
    warning: function(level) {
      if (level === "critical") {
        sequence([
          { freq: 1120, duration: 0.05, type: "square", vol: 0.05 },
          { freq: 1480, duration: 0.05, type: "square", vol: 0.05 },
        ], 55);
      } else {
        play(860, 0.06, "triangle", 0.04);
      }
    },
    shieldBreak: function() {
      sequence([
        { freq: 280, duration: 0.08, type: "sawtooth", vol: 0.08 },
        { freq: 180, duration: 0.1, type: "triangle", vol: 0.06 },
      ], 40);
    },
    bossExplode: function() {
      play(80, 0.4, "sawtooth", 0.15);
      setManagedTimeout(function() { play(60, 0.3, "square", 0.1); }, 100);
    },
  };
})();

function resumeAudioContext() {
  const c = AudioSys.getCtx();
  if (c && c.state === "suspended" && options.soundEnabled) {
    c.resume().catch(function(error) {
      debugLog("Audio resume failed", error);
    });
  }
}

function suspendAudioContext() {
  const c = AudioSys.peekCtx();
  if (c && c.state === "running") {
    c.suspend().catch(function(error) {
      debugLog("Audio suspend failed", error);
    });
  }
}

// ============================================================
// ACCESSIBILITY: Enhanced ARIA live region updates
// ============================================================
let lastAriaUpdate = "";

function updateARIA(text) {
  if (text === lastAriaUpdate) return;
  lastAriaUpdate = text;
  const el = document.getElementById("game-status");
  if (el) {
    el.textContent = text;
  }
}

// ============================================================
// HIGH SCORE SYSTEM (localStorage)
// ============================================================
function sanitizeHighScores(scores) {
  if (!Array.isArray(scores)) {
    return [];
  }
  return scores
    .map(function(entry) {
      return {
        score: clamp(Number(entry && entry.score) || 0, 0, 9999999),
        wave: clamp(Number(entry && entry.wave) || 1, 1, 999),
        date: entry && typeof entry.date === "string" ? entry.date.slice(0, 40) : new Date().toISOString(),
      };
    })
    .sort(function(a, b) { return b.score - a.score; })
    .slice(0, 10);
}

function saveHighScore(score, wave) {
  const highScores = loadHighScores(true);
  highScores.push({
    score: clamp(Number(score) || 0, 0, 9999999),
    wave: clamp(Number(wave) || 1, 1, 999),
    date: new Date().toISOString(),
  });
  cachedHighScores = sanitizeHighScores(highScores);
  writeStoredJSON(STORAGE_KEYS.highScores, cachedHighScores);
}

function loadHighScores(forceRefresh) {
  if (!forceRefresh && cachedHighScores) {
    return cachedHighScores.slice();
  }
  cachedHighScores = sanitizeHighScores(parseStoredJSON(STORAGE_KEYS.highScores, []));
  return cachedHighScores.slice();
}

function getHighScore() {
  const scores = loadHighScores();
  return scores.length > 0 ? scores[0].score : 0;
}

function sanitizeSavedGame(save) {
  if (!save || typeof save !== "object") {
    return null;
  }
  const timestamp = Number(save.timestamp) || 0;
  if (!timestamp || Date.now() - timestamp > STORAGE_TTL_MS) {
    return null;
  }
  return {
    score: clamp(Number(save.score) || 0, 0, 9999999),
    wave: clamp(Number(save.wave) || 1, 1, 999),
    lives: clamp(Number(save.lives) || CFG.START_LIVES, 1, CFG.MAX_LIVES),
    timestamp: timestamp,
  };
}

function loadSavedGame(forceRefresh) {
  if (!forceRefresh && cachedSavedGame !== undefined) {
    return cachedSavedGame;
  }
  cachedSavedGame = sanitizeSavedGame(parseStoredJSON(STORAGE_KEYS.saveGame, null));
  if (!cachedSavedGame) {
    try {
      localStorage.removeItem(STORAGE_KEYS.saveGame);
    } catch (error) {
      debugLog("Saved game clear failed", error);
    }
  }
  return cachedSavedGame;
}

function saveGameState() {
  if (!game || (game.mode !== "PLAYING" && game.mode !== "PAUSED")) {
    return;
  }
  const state = {
    score: clamp(game.score, 0, 9999999),
    wave: clamp(game.wave, 1, 999),
    lives: clamp(game.lives, 1, CFG.MAX_LIVES),
    timestamp: Date.now(),
  };
  if (writeStoredJSON(STORAGE_KEYS.saveGame, state)) {
    cachedSavedGame = state;
  }
}

function clearSavedGameState() {
  cachedSavedGame = null;
  try {
    localStorage.removeItem(STORAGE_KEYS.saveGame);
  } catch (error) {
    debugLog("Saved game clear failed", error);
  }
}

// ============================================================
// SCREEN SHAKE SYSTEM
// ============================================================
const screenShake = {
  timeLeft: 0,
  intensity: 0,
  offsetX: 0,
  offsetY: 0,
};

function triggerShake(intensity, duration) {
  if (prefersReducedMotion) {
    screenShake.intensity = 0;
    screenShake.timeLeft = 0;
    return;
  }
  screenShake.intensity = intensity || CFG.SHAKE_INTENSITY;
  screenShake.timeLeft = duration || CFG.SHAKE_DURATION;
}

function updateShake(dt) {
  if (screenShake.timeLeft > 0) {
    screenShake.timeLeft -= dt * 1000;
    const factor = screenShake.timeLeft / CFG.SHAKE_DURATION;
    screenShake.offsetX = (Math.random() - 0.5) * 2 * screenShake.intensity * factor;
    screenShake.offsetY = (Math.random() - 0.5) * 2 * screenShake.intensity * factor;
  } else {
    screenShake.offsetX = 0;
    screenShake.offsetY = 0;
  }
}

function isPowerupActive(type) {
  return !!(game && game.activePowerups && game.activePowerups[type] && game.activePowerups[type].active && game.time < game.activePowerups[type].expiresAt);
}

function getPowerupRemaining(type) {
  if (!isPowerupActive(type)) {
    return 0;
  }
  return Math.max(0, game.activePowerups[type].expiresAt - game.time);
}

function getPlayerFireCooldown() {
  return isPowerupActive("rapid-fire") ? CFG.FIRE_COOLDOWN * 0.5 : CFG.FIRE_COOLDOWN;
}

function getEnemyTimeScale() {
  return isPowerupActive("slow-motion") ? 0.55 : 1;
}

function getScoreMultiplier() {
  return isPowerupActive("score-multiplier")
    ? (POWERUP_TYPES["score-multiplier"].multiplier || 2)
    : 1;
}

function getActiveSynergies() {
  if (!game) {
    return [];
  }
  return POWERUP_SYNERGIES.filter(function(synergy) {
    return synergy.types.every(function(type) {
      return isPowerupActive(type);
    });
  });
}

function getComboMultiplier() {
  if (!game) {
    return 1;
  }
  if (game.combo >= 10) {
    return 2;
  }
  if (game.combo >= 5) {
    return 1.5;
  }
  return 1;
}

function pushHudAlert(text, color, ttl) {
  if (!game) {
    return;
  }
  game.hudAlerts.push({
    text: text,
    color: color || "#ffffff",
    ttl: ttl || CFG.HUD_ALERT_TTL,
    maxTtl: ttl || CFG.HUD_ALERT_TTL,
  });
  if (game.hudAlerts.length > 4) {
    game.hudAlerts.shift();
  }
}

function beginTransition(label, color, duration, kind) {
  if (!game) {
    return;
  }
  game.transition = {
    label: label,
    color: color || "#00ffff",
    startAt: game.time,
    duration: duration || CFG.TRANSITION_DURATION,
    kind: kind || "pulse",
  };
}

function updateTransitionState() {
  if (!game || !game.transition) {
    return;
  }
  if (game.time >= game.transition.startAt + game.transition.duration) {
    game.transition = null;
  }
}

function resetCombo() {
  if (!game) {
    return;
  }
  game.combo = 0;
  game.comboDecayAt = 0;
  game.comboFlash = 0;
}

function registerComboKill() {
  game.combo += 1;
  game.bestCombo = Math.max(game.bestCombo, game.combo);
  game.comboDecayAt = game.time + CFG.COMBO_DECAY_MS;
  game.comboFlash = 700;
  if (game.combo === 3 || game.combo === 5 || game.combo === 10 || game.combo === 20) {
    AudioSys.combo(game.combo);
    pushHudAlert("COMBO x" + game.combo, "#ffd84d", 1100);
  }
}

function updateCombo(dt) {
  if (!game) {
    return;
  }
  game.comboFlash = Math.max(0, game.comboFlash - dt * 1000);
  if (game.combo > 0 && game.comboDecayAt > 0 && game.time >= game.comboDecayAt) {
    game.combo -= 1;
    game.comboDecayAt = game.combo > 0 ? game.time + CFG.COMBO_DECAY_MS : 0;
  }
}

function updateVisualWarnings() {
  if (!game) {
    return;
  }
  game.visualWarnings.enemyApproaching = false;
  game.visualWarnings.powerupExpiring = false;
  game.visualWarnings.lowHealth = game.lives <= 2;
  game.visualWarnings.comboReady = game.combo >= 5;

  if (!game.player || !game.player.alive) {
    return;
  }

  for (var i = 0; i < game.enemyShots.length; i++) {
    var shot = game.enemyShots[i];
    if (!shot.alive || shot.y <= game.player.y - 6) {
      continue;
    }
    var dx = shot.x - game.player.x;
    var dy = shot.y - game.player.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < 170) {
      game.visualWarnings.enemyApproaching = true;
      break;
    }
  }

  if (!game.visualWarnings.enemyApproaching) {
    for (var j = 0; j < game.enemies.length; j++) {
      var enemy = game.enemies[j];
      if (!enemy.alive) continue;
      if (enemy.aiState === "DIVING" && Math.abs(enemy.x - game.player.x) < 90 && enemy.y < game.player.y) {
        game.visualWarnings.enemyApproaching = true;
        break;
      }
    }
  }

  var timedTypes = Object.keys(game.activePowerups);
  for (var k = 0; k < timedTypes.length; k++) {
    var type = timedTypes[k];
    if (isPowerupActive(type) && getPowerupRemaining(type) < 3000) {
      game.visualWarnings.powerupExpiring = true;
      break;
    }
  }
}

function updateAudioWarnings() {
  if (!game || game.mode !== "PLAYING" || !options.soundEnabled || !game.player || !game.player.alive) {
    return;
  }
  if (game.audioWarningUntil <= game.time) {
    game.audioWarningLevel = "";
  }
  if (game.time < game.nextAudioWarningAt) {
    return;
  }

  var nearest = Infinity;
  for (var i = 0; i < game.enemyShots.length; i++) {
    var shot = game.enemyShots[i];
    if (!shot.alive || shot.y <= game.player.y - 8) {
      continue;
    }
    var dx = shot.x - game.player.x;
    var dy = shot.y - game.player.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < nearest) {
      nearest = distance;
    }
  }

  if (nearest < 90) {
    AudioSys.warning("critical");
    game.audioWarningLevel = "critical";
    game.audioWarningUntil = game.time + 650;
    game.nextAudioWarningAt = game.time + 420;
  } else if (nearest < 170) {
    AudioSys.warning("near");
    game.audioWarningLevel = "near";
    game.audioWarningUntil = game.time + 550;
    game.nextAudioWarningAt = game.time + 720;
  }

}

function spawnPowerup(x, y, type) {
  return {
    x: x,
    y: y,
    w: CFG.POWERUP_SIZE,
    h: CFG.POWERUP_SIZE,
    type: type,
    color: POWERUP_TYPES[type].color,
    dropSpeed: CFG.POWERUP_DROP_SPEED,
    bobOffset: Math.random() * Math.PI * 2,
    bobSpeed: 3,
    ttl: CFG.POWERUP_TTL,
    alive: true,
    pulse: 0,
  };
}

function maybeSpawnPowerup(x, y) {
  if (!game || game.powerups.length >= POWERUP_SYSTEM.maxOnScreen || Math.random() > POWERUP_SYSTEM.spawnChance) {
    return;
  }
  const type = pickWeightedPowerupType();
  game.powerups.push(spawnPowerup(x, y, type));
}

function activateTimedPowerup(type) {
  const definition = POWERUP_TYPES[type];
  const state = game.activePowerups[type];
  if (!definition || !state) {
    return;
  }
  state.active = true;
  state.expiresAt = Math.max(game.time, state.expiresAt) + definition.duration;
  pushHudAlert(definition.label + " ONLINE", definition.color, 1000);
}

function triggerLuckyShot() {
  let destroyedShots = 0;
  for (let i = 0; i < game.enemyShots.length; i++) {
    const shot = game.enemyShots[i];
    if (!shot.alive) {
      continue;
    }
    shot.alive = false;
    destroyedShots += 1;
    spawnExplosion(shot.x, shot.y, "#ffd84d", "normal");
  }
  game.luckyShotUntil = game.time + 900;
  game.luckyWaveRadius = 0;
  pushHudAlert("LUCKY SHOT", POWERUP_TYPES["lucky-shot"].color, 1200);
  AudioSys.luckyShot();
  triggerShake(5, 250);
  if (destroyedShots > 0) {
    spawnScorePopup(CFG.W / 2, CFG.H * 0.35, destroyedShots * 25, "CLEAR");
    game.score += destroyedShots * 25;
  }
}

function collectPowerup(powerup) {
  const definition = POWERUP_TYPES[powerup.type];
  const synergyBefore = getActiveSynergies().map(function(synergy) {
    return synergy.id;
  }).join("|");
  powerup.alive = false;
  powerup.ttl = 0;
  game.stats.powerupsCollected += 1;
  game.pickupFlash = 1;
  game.pickupFlashColor = definition.color;
  AudioSys.powerup(powerup.type);

  if (powerup.type === "multi-life") {
    game.lives = Math.min(CFG.MAX_LIVES, game.lives + 1);
    pushHudAlert("1UP SECURED", definition.color, 1200);
  } else if (powerup.type === "lucky-shot") {
    triggerLuckyShot();
  } else {
    activateTimedPowerup(powerup.type);
  }

  if (powerup.type === "shield") {
    game.player.invulnerableUntil = Math.max(game.player.invulnerableUntil, game.time + 250);
  }

  if (powerup.type === "score-multiplier") {
    pushHudAlert("SCORE x2", definition.color, 1200);
  }

  beginTransition(definition.label, definition.color, 520, "powerup");
  vibratePattern("powerup");

  const newSynergies = getActiveSynergies().filter(function(synergy) {
    return synergyBefore.indexOf(synergy.id) === -1;
  });
  if (newSynergies.length > 0) {
    const synergy = newSynergies[0];
    game.synergyFlash = 900;
    pushHudAlert(synergy.label + " SYNC", synergy.color, 1400);
    beginTransition(synergy.label + " SYNC", synergy.color, 620, "pulse");
    updateARIA(synergy.announce);
  }
}

function updatePowerups(dt) {
  const dtMs = dt * 1000;
  for (let i = 0; i < game.powerups.length; i++) {
    const powerup = game.powerups[i];
    if (!powerup.alive) {
      continue;
    }
    powerup.ttl -= dtMs;
    powerup.y += powerup.dropSpeed * dt;
    powerup.pulse += dt * 6;
    powerup.x += Math.sin(game.time / 400 + powerup.bobOffset) * 12 * dt;
    if (powerup.ttl <= 0 || powerup.y > CFG.H + 24) {
      powerup.alive = false;
      continue;
    }
    if (game.player.alive && aabb(powerup.x, powerup.y, powerup.w, powerup.h, game.player.x, game.player.y, game.player.w + 8, game.player.h + 8)) {
      collectPowerup(powerup);
    }
  }

  const timedTypes = Object.keys(game.activePowerups);
  for (let j = 0; j < timedTypes.length; j++) {
    const type = timedTypes[j];
    const state = game.activePowerups[type];
    if (!state.active) {
      continue;
    }
    const remaining = state.expiresAt - game.time;
    if (remaining <= 0) {
      state.active = false;
      state.expiresAt = 0;
      pushHudAlert(POWERUP_TYPES[type].label + " OFFLINE", shadeColor(POWERUP_TYPES[type].color, 0.7), 900);
    }
  }
}

function updateHudAlerts(dt) {
  const dtMs = dt * 1000;
  game.synergyFlash = Math.max(0, game.synergyFlash - dtMs);
  for (let i = game.hudAlerts.length - 1; i >= 0; i--) {
    game.hudAlerts[i].ttl -= dtMs;
    if (game.hudAlerts[i].ttl <= 0) {
      game.hudAlerts.splice(i, 1);
    }
  }
}

function getAccuracyPercent() {
  if (!game || game.stats.shotsFired <= 0) {
    return 0;
  }
  return Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
}

// ============================================================
// GAME STATE
// ============================================================
let game;

function initStars() {
  const stars = [];
  const starCount = prefersReducedMotion ? Math.floor(CFG.STAR_COUNT * 0.75) : CFG.STAR_COUNT;
  for (let i = 0; i < starCount; i++) {
    const layerRoll = Math.random();
    let layer;
    let speed;
    let size;
    let alpha;
    if (layerRoll < 0.3) {
      layer = 0;
      speed = CFG.STAR_SPEED_MIN + Math.random() * 15;
      size = 1;
      alpha = 0.3 + Math.random() * 0.2;
    } else if (layerRoll < 0.7) {
      layer = 1;
      speed = CFG.STAR_SPEED_MIN + 15 + Math.random() * 25;
      size = 1.5;
      alpha = 0.5 + Math.random() * 0.3;
    } else {
      layer = 2;
      speed = CFG.STAR_SPEED_MIN + 40 + Math.random() * (CFG.STAR_SPEED_MAX - CFG.STAR_SPEED_MIN - 40);
      size = 2;
      alpha = 0.7 + Math.random() * 0.3;
    }
    stars.push({
      x: Math.random() * CFG.W,
      y: Math.random() * CFG.H,
      speed: speed,
      brightness: alpha,
      size: size,
      layer: layer,
    });
  }
  return stars;
}

function resetGame() {
  game = {
    mode: "START",
    score: 0,
    lives: CFG.START_LIVES,
    wave: 1,
    time: 0,
    player: {
      x: CFG.W / 2,

      w: CFG.PLAYER_W,
      h: CFG.PLAYER_H,
      speed: CFG.PLAYER_SPEED,
      fireTimerMs: 0,
      invulnerableUntil: 0,
      respawnAt: 0,
      alive: true,
      bank: 0,
      bobPhase: 0,
      enginePulse: 0,
    },
    enemies: [],
    playerShots: [],
    enemyShots: [],
    powerups: [],
    particles: [],
    stars: initStars(),
    waveInProgress: false,
    nextDiveTime: 0,
    nextFormationFireTime: 0,
    startConsumed: false,
    pauseStartTime: 0,
    error: null,
    highScoreSaved: false,
    scorePopups: [],
    hudAlerts: [],
    lastWaveAnnouncement: null,
    nextAutoSaveTime: 0,
    activePowerups: createActivePowerupState(),
    combo: 0,
    comboDecayAt: 0,
    comboFlash: 0,
    bestCombo: 0,
    damageFlash: 0,
